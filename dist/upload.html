<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Billeder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .upload-area {
            border: 2px dashed #666;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: #2a2a2a;
        }
        .upload-area:hover {
            border-color: #999;
            background: #333;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #45a049;
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #fileList {
            margin-top: 20px;
            text-align: left;
        }
        .file-item {
            padding: 10px;
            margin: 5px 0;
            background: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .status.success {
            background: #4CAF50;
            display: block;
        }
        .status.error {
            background: #f44336;
            display: block;
        }
        .progress {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
  <script type="module" crossorigin src="/assets/upload-DkvD3qn1.js"></script>
</head>
<body>
    <h1>Upload Billeder til Old Barrel</h1>
    <p>Upload alle 11 billeder her. De vil blive uploadet til Supabase Storage.</p>

    <div class="upload-area" id="dropArea">
        <p>Træk billeder hertil eller klik for at vælge</p>
        <button class="btn" onclick="document.getElementById('fileInput').click()">Vælg Filer</button>
        <input type="file" id="fileInput" multiple accept="image/*">
    </div>

    <div id="fileList"></div>

    <button class="btn" id="processBtn" style="display:none; margin-top: 20px;" onclick="uploadImages()">
        Upload Billeder
    </button>

    <div id="status" class="status"></div>
    <div id="progress" class="progress"></div>

</body>
</html>
