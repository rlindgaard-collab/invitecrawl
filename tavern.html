<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inde i Old Barrel Tavern</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tavern-page">
    <div class="tavern-contents">
      <header>
        <h1>Indenfor i Old Barrel Tavern</h1>
        <p>Stemningen er varm, og stearinlysene leder dig længere ind i tavernen.</p>
      </header>
      <figure class="tavern-photo">
        <img
          src="tavern-interior.jpg"
          alt="Stemningsfyldt taverne med stenmure, træborde og stearinlys."
          loading="lazy"
        />
        <div class="tavern-glows" aria-hidden="true">
          <span class="tavern-glow tavern-glow--front"></span>
          <span class="tavern-glow tavern-glow--left"></span>
          <span class="tavern-glow tavern-glow--right"></span>
          <span class="tavern-glow tavern-glow--back"></span>
          <span class="tavern-glow tavern-glow--sconce-left"></span>
          <span class="tavern-glow tavern-glow--sconce-right"></span>
        </div>
      </figure>
      <div class="tavern-actions">
        <a class="tavern-action" href="door.html">Tilbage til døren</a>
        <a class="tavern-action tavern-action--primary" href="tavern-table.html">
          Sæt dig ved et bord
        </a>
      </div>
    </div>
  </body>
</html>
