<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ved bordet i Old Barrel Tavern</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tavern-page">
    <div class="tavern-contents">
      <header>
        <h1>Du har taget plads ved bordet</h1>
        <p>Du læner dig frem over det gamle træbord, mens lyset fra stearinlysene danser omkring dig.</p>
      </header>
      <figure class="tavern-photo tavern-photo--table">
        <img
          src="tavern-table.jpg"
          alt="Et rustikt træbord i en taverne oplyst af stearinlys."
          loading="lazy"
        />
        <div class="tavern-glows" aria-hidden="true">
          <span class="tavern-glow tavern-glow--front"></span>
          <span class="tavern-glow tavern-glow--back"></span>
          <span class="tavern-glow tavern-glow--sconce-left"></span>
          <span class="tavern-glow tavern-glow--sconce-right"></span>
        </div>
      </figure>
      <div class="tavern-actions">
        <a class="tavern-action tavern-action--primary" href="tavern-server.html">
          Bestil hos tjeneren
        </a>
        <a class="tavern-action" href="tavern.html">Tilbage til baren</a>
        <a class="tavern-action" href="door.html">Tilbage til døren</a>
      </div>
    </div>
  </body>
</html>
